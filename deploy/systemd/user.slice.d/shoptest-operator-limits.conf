# Install as /etc/systemd/system/user-<operator-uid>.slice.d/shoptest-operator-limits.conf.
# This bounds interactive Shoptest builds, browser checks, and agent processes launched
# from that operator's SSH sessions. It deliberately leaves capacity for core services.
[Slice]
MemoryHigh=3G
MemoryMax=4G
MemorySwapMax=1G
TasksMax=2048
CPUQuota=150%
